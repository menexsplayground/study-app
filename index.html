    function cleanAndFormatText(text) {
      if (!text) return '';
      let s = String(text);
      s = s.replace(/\[(?:EXTRA|DODATEČNÉ INFORMACE|ZAJÍMAVOST|SOUVISLOSTI?):\s*([\s\S]*?)\]/gi,
        '<div class="my-4 p-4 rounded-2xl bg-blue-950/40 border border-blue-500/50 text-blue-200 text-xs leading-relaxed shadow-lg">' +
        '<div class="font-bold text-blue-300 flex items-center gap-2 mb-1.5 text-xs uppercase tracking-wider"><span>🔍</span> Dodatečné informace & Souvislosti</div>$1</div>'
      );
      s = s.replace(/\[(?:TIP NA PAMĚŤ|MNEMOTECHNIKA|PAMĚŤ|TIP|JAK SI ZAPAMATOVAT):\s*([\s\S]*?)\]/gi,
        '<div class="my-4 p-4 rounded-2xl bg-amber-950/40 border border-amber-500/50 text-amber-200 text-xs leading-relaxed shadow-lg">' +
        '<div class="font-bold text-amber-300 flex items-center gap-2 mb-1.5 text-xs uppercase tracking-wider"><span>🧠</span> Mnemotechnická pomůcka & Jak si to zapamatovat</div>$1</div>'
      );
      s = s.replace(/^### (.*$)/gim, '<h3 class="text-lg font-bold text-amber-300 mt-5 mb-2">$1</h3>');
      s = s.replace(/^## (.*$)/gim, '<h2 class="text-xl font-extrabold text-amber-400 mt-6 mb-2">$1</h2>');
      s = s.replace(/^# (.*$)/gim, '<h1 class="text-2xl font-black text-amber-400 mt-7 mb-3">$1</h1>');
      s = s.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-100">$1</strong>');
      s = s.replace(/\*(.*?)\*/g, '<em class="text-slate-300 italic">$1</em>');
      s = s.replace(/\*/g, '');
      s = s.replace(/^\s*[-•]\s+(.*$)/gim, '<div class="flex items-start gap-2.5 my-1.5"><span class="text-amber-400 font-bold">•</span><span class="text-slate-200">$1</span></div>');
      s = s.replace(/\n\n/g, '<div class="h-3"></div>');
      s = s.replace(/\n/g, '<br>');
      return s;
    }

    function loadCleanSubjects() {
      try {
        const raw = localStorage.getItem('study_data');
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(s => s && s.name).map(s => ({
          id: s.id || ('sub_' + Date.now()),
          name: String(s.name).trim(),
          topics: Array.isArray(s.topics) ? s.topics.filter(t => t && (t.title || t.content)) : []
        }));
      } catch (e) { return []; }
    }

    const state = {
      apiKey: HARDCODED_GROQ_KEY,
      ghToken: (localStorage.getItem('github_token') || MASKED_GH_TOKEN).trim(),
      ghSha: localStorage.getItem('github_data_sha') || null,
      subjects: loadCleanSubjects(),
      selectedTopics: [],
      currentMode: null,
      chatHistory: [],
      oralExamHistory: [],
      currentTestPrompt: ''
    };

    // Vždy uložíme funkční token do paměti
    localStorage.setItem('github_token', state.ghToken);

    function setCloudStatus(type, text) {
      const badge = document.getElementById('cloudBadge');
      if (!badge) return;
      if (type === 'syncing') {
        badge.className = 'text-[11px] px-2.5 py-1 rounded-full bg-blue-900/40 text-blue-300 font-semibold border border-blue-700/60';
        badge.innerHTML = `⏳ ${text}`;
      } else if (type === 'synced') {
        badge.className = 'text-[11px] px-2.5 py-1 rounded-full bg-emerald-900/40 text-emerald-300 font-semibold border border-emerald-700/60';
        badge.innerHTML = `☁️ ${text}`;
      } else {
        badge.className = 'text-[11px] px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 font-semibold border border-slate-700/60';
        badge.innerHTML = `💾 ${text}`;
      }
    }

    async function pullFromCloud(silent = false) {
      if (!state.ghToken) return false;
      if (!silent) setCloudStatus('syncing', 'Stahuji...');
      try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.dataFile}?t=${Date.now()}`, {
          headers: { 'Authorization': `Bearer ${state.ghToken}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.status === 200) {
          const data = await res.json();
          state.ghSha = data.sha;
          localStorage.setItem('github_data_sha', data.sha);
          const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
          const list = JSON.parse(decoded);
          if (Array.isArray(list) && list.length > 0) {
            state.subjects = list;
            localStorage.setItem('study_data', JSON.stringify(state.subjects));
            setCloudStatus('synced', 'Synchronizováno');
            return true;
          }
        }
      } catch (e) {}
      setCloudStatus('synced', 'Připraveno');
      return false;
    }

    async function pushToCloud() {
      localStorage.setItem('study_data', JSON.stringify(state.subjects));
      if (!state.ghToken) return { success: false, msg: 'Chybí token' };
      setCloudStatus('syncing', 'Ukládám...');
      try {
        let currentSha = state.ghSha;
        try {
          const check = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.dataFile}?t=${Date.now()}`, {
            headers: { 'Authorization': `Bearer ${state.ghToken}`, 'Accept': 'application/vnd.github.v3+json' }
          });
          if (check.ok) currentSha = (await check.json()).sha;
        } catch(e) {}

        const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(state.subjects, null, 2))));
        const payload = { message: 'Aktualizace sešitů', content: encodedContent };
        if (currentSha) payload.sha = currentSha;

        const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.dataFile}`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${state.ghToken}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
          body: JSON.stringify(payload)
        });

        const resData = await res.json();
        if (res.ok) {
          state.ghSha = resData.content.sha;
          localStorage.setItem('github_data_sha', state.ghSha);
          setCloudStatus('synced', 'Uloženo na web');
          return { success: true };
        }
        return { success: false, msg: resData.message || JSON.stringify(resData) };
      } catch (err) {
        return { success: false, msg: err.message };
      }
    }

    function getTotalTopicsCount() {
      return state.subjects.reduce((sum, s) => sum + (s && s.topics ? s.topics.length : 0), 0);
    }

    function nav(screen, param = null) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      switch(screen) {
        case 'home': renderHome(); break;
        case 'topicSelect': renderTopicSelect(param); break;
        case 'uceniHub': renderUceniHub(); break;
        case 'zkouseniHub': renderZkouseniHub(); break;
        case 'vkladani': renderVkladani(); break;
        case 'manage': renderManageSubjects(); break;
        case 'settings': renderSettings(); break;
        case 'result': renderOutputView(param); break;
        case 'chat': renderChatView(); break;
        case 'flashcards': renderFlashcardsView(param); break;
        case 'oralExam': renderOralExamView(); break;
      }
    }

          </button>
          <button onclick="nav('topicSelect', 'zkouseni')" class="p-5 md:p-6 rounded-2xl bg-cardBg border border-purple-500/30 flex items-center gap-4 text-left hover:border-purple-500 active:scale-95 transition">
            <span class="text-4xl">🎯</span>

    function renderTopicSelect(targetMode) {
      state.currentMode = targetMode;
      const app = document.getElementById('app');
      if (state.subjects.length === 0 || getTotalTopicsCount() === 0) {
        app.innerHTML = `
          <div class="text-center py-12">
            <span class="text-4xl">📂</span>
            <p class="text-slate-300 font-bold mt-3 mb-2">V tomto zařízení zatím nejsou sešity</p>
            <p class="text-xs text-slate-400 mb-5">Pokud jsi je uložil jinde, jdi do Nastavení ⚙️ a klikni na "Stáhnout z cloudu".</p>
            <button onclick="nav('vkladani')" class="px-5 py-3 rounded-xl bg-emerald-600 font-bold text-sm">Vložit nový sešit</button>
          </div>
        `;
        return;
      }
      
      let subjectsHtml = '';
      state.subjects.forEach(sub => {
        if (!sub || !sub.topics || sub.topics.length === 0) return;
        
        const chapterGroups = {};
        sub.topics.forEach(t => {
          const chName = t.chapter || 'Hlavní látka';
          if (!chapterGroups[chName]) chapterGroups[chName] = [];
          chapterGroups[chName].push(t);
        });

        let chaptersHtml = '';
        Object.keys(chapterGroups).forEach((chName, chIdx) => {
          const groupTopics = chapterGroups[chName];
          const allGroupChecked = groupTopics.every(t => state.selectedTopics.some(st => st && st.id === t.id));

          let topicsInChapterHtml = '';
          groupTopics.forEach(top => {
            const isChecked = state.selectedTopics.some(t => t && t.id === top.id) ? 'checked' : '';
            topicsInChapterHtml += `
              <label class="flex items-center gap-3 p-2.5 rounded-lg bg-slate-900/60 border border-slate-800 cursor-pointer active:bg-slate-800 hover:border-slate-700">
                <input type="checkbox" value="${top.id}" data-sub="${sub.id}" data-chapter="${chName}" class="w-4 h-4 accent-amber-500 rounded topic-cb" ${isChecked} onchange="syncChapterHeader('${sub.id}', '${chIdx}')">
                <div class="flex-1">
                  <span class="text-xs font-semibold text-slate-200 block">${top.title || 'Téma'}</span>
                </div>
              </label>
            `;
          });

          chaptersHtml += `
            <div class="mb-4 bg-slate-950/70 p-3.5 rounded-xl border border-slate-800/80">
              <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800">
                <div class="flex items-center gap-2">
                  <span class="text-sm">📁</span>
                  <span class="font-bold text-xs text-amber-300 uppercase tracking-wider">${chName}</span>
                </div>
                <label class="flex items-center gap-1.5 cursor-pointer text-xs font-semibold text-slate-300 bg-slate-800 px-2 py-1 rounded hover:bg-slate-700">
                  <input type="checkbox" id="chHeader_${sub.id}_${chIdx}" class="w-3.5 h-3.5 accent-amber-500 rounded" ${allGroupChecked ? 'checked' : ''} onchange="toggleEntireChapter('${sub.id}', '${chName}', this.checked, '${chIdx}')">
                  <span>Vybrat celou kapitolu</span>
                </label>
              </div>
              <div class="grid gap-1.5 pl-2">${topicsInChapterHtml}</div>
            </div>
          `;
        });

        subjectsHtml += `
          <div class="mb-6 bg-cardBg p-4 rounded-2xl border border-slate-800 shadow-xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
              <h3 class="font-black text-base text-amber-400">${sub.name}</h3>
              <button onclick="toggleAllInSub('${sub.id}')" class="text-xs text-slate-400 hover:text-slate-200 bg-slate-800 px-2.5 py-1 rounded">Vybrat úplně vše</button>

            <div>${chaptersHtml}</div>
          </div>

      });

      app.innerHTML = `
        <button onclick="nav('home')" class="text-xs text-slate-400 mb-3">← Domů</button>

        <div class="mt-4">${subjectsHtml}</div>
        <div class="sticky bottom-4 pt-2">

            Pokračovat s vybranou látkou

    async function getActiveGroqModel() {
      if (cachedActiveGroqModel) return cachedActiveGroqModel;
      const key = state.apiKey.trim();
      try {
        const res = await fetch('https://api.groq.com/openai/v1/models', {
          headers: { 'Authorization': `Bearer ${key}` }
        });
        if (res.ok) {
          const json = await res.json();
          if (json && json.data) {
            const availableIds = json.data.map(m => m.id);
            const preferred = ['openai/gpt-oss-120b', 'qwen/qwen3.8-27b', 'openai/gpt-oss-20b'];
            for (const p of preferred) {
              if (availableIds.includes(p)) { cachedActiveGroqModel = p; return p; }
            }
            if (availableIds.length > 0) { cachedActiveGroqModel = availableIds[0]; return availableIds[0]; }
          }
        }
      } catch(e) {}
      cachedActiveGroqModel = 'openai/gpt-oss-120b';
      return cachedActiveGroqModel;
    }

    async function executeGroqChat(messages, retryCount = 0) {
      const key = state.apiKey.trim();
      const model = await getActiveGroqModel();
      
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body: JSON.stringify({ model: model, messages: messages, temperature: 0.2 })
      });

      const data = await res.json();

      if (res.status === 429 && retryCount < 3) {
        console.warn(`Groq 429 Rate limit - čekám ${3.5 * (retryCount + 1)}s...`);
        await new Promise(r => setTimeout(r, 3500 * (retryCount + 1)));
        return await executeGroqChat(messages, retryCount + 1);
      }

      if (!res.ok || (data && data.error)) {
        throw new Error(data && data.error ? data.error.message : `Chyba HTTP ${res.status}`);
      }
      return { text: data.choices[0].message.content, model };
    }

    function extractTopicsList(rawText) {
      let cleaned = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
      const first = cleaned.search(/[\{\[]/);
      const last = Math.max(cleaned.lastIndexOf('}'), cleaned.lastIndexOf(']'));
      if (first !== -1 && last !== -1) cleaned = cleaned.substring(first, last + 1);
      
      let parsed;
      try { parsed = JSON.parse(cleaned); } catch(e) {
        cleaned = cleaned.replace(/,\s*([\]}])/g, '$1');
        try { parsed = JSON.parse(cleaned); } catch(err) { return []; }
      }
      
      if (parsed && parsed.chapters && Array.isArray(parsed.chapters)) {
        const flat = [];
        parsed.chapters.forEach(ch => {
          const chName = ch.chapter || 'Hlavní látka';
          if (Array.isArray(ch.topics)) {
            ch.topics.forEach(t => flat.push({ chapter: chName, title: t.title, content: t.content }));
          }
        });
        if (flat.length > 0) return flat;
      }

      if (Array.isArray(parsed)) return parsed;
      if (parsed && typeof parsed === 'object') {
        for (let k of Object.keys(parsed)) {
          if (Array.isArray(parsed[k])) return parsed[k];
        }
        if (parsed.title || parsed.content) return [parsed];
      }
      return [];
    }

    function splitTextIntoSafeChunks(text, maxChars = 3200) {
      if (text.length <= maxChars) return [text];
      const paragraphs = text.split(/\n\s*\n/);
      const chunks = [];
      let current = '';
      for (const p of paragraphs) {
        if ((current + '\n\n' + p).length > maxChars && current.length > 0) {
          chunks.push(current.trim());
          current = p;
        } else {
          current = current ? current + '\n\n' + p : p;
        }
      }
      if (current.trim()) chunks.push(current.trim());
      return chunks;
    }

    async function processFullTextNotebook() {
      const subName = getResolvedSubjectName();
      const textArea = document.getElementById('inputTextFull');
      const fullText = textArea ? textArea.value.trim() : '';
      if (!subName) { alert('Vyber nebo zadej předmět!'); return; }
      if (!fullText) { alert('Vlož text sešitu!'); return; }
      
      const btn = document.getElementById('saveTextBtn');
      if (btn) btn.disabled = true;

      const chunks = splitTextIntoSafeChunks(fullText, 3200);
      const allExtractedTopics = [];

      for (let i = 0; i < chunks.length; i++) {
        if (btn) btn.innerText = `⚡ Tvořím kapitoly: Část ${i + 1} z ${chunks.length}...`;
        
        const messages = [
          { role: "system", content: "Rozděl zadaný text sešitu do logických HLAVNÍCH KAPITOL a PODTÉMAT. Vrať VÝHRADNĚ platný JSON ve formátu: {\"chapters\": [{\"chapter\": \"Název hlavní kapitoly\", \"topics\": [{\"title\": \"Název podtématu\", \"content\": \"text poznámek...\"}]}]}. Nikdy nepoužívej hvězdičky pro nadpisy." },
          { role: "user", content: `Předmět: ${subName}\nČást ${i + 1}/${chunks.length}:\n\n${chunks[i]}` }
        ];

        try {
          const { text: raw } = await executeGroqChat(messages);
          const chunkTopics = extractTopicsList(raw);
          chunkTopics.forEach(t => allExtractedTopics.push(t));
          if (i < chunks.length - 1) await new Promise(r => setTimeout(r, 800));
        } catch (err) {
          console.error('Chyba v části ' + (i + 1), err);
        }
      }

      if (allExtractedTopics.length === 0) {
        alert('AI nenašla v textu žádné nadpisy.');
        if (btn) { btn.innerText = '⚡ Rozdělit sešit na témata'; btn.disabled = false; }
        return;
      }

      let sub = state.subjects.find(s => s && s.name && s.name.toLowerCase() === subName.toLowerCase());
      if (!sub) { sub = { id: 'sub_' + Date.now(), name: subName, topics: [] }; state.subjects.push(sub); }
      if (!Array.isArray(sub.topics)) sub.topics = [];

      allExtractedTopics.forEach(t => {

            id: 'top_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            chapter: String(t.chapter || 'Hlavní látka').trim(),
            title: String(t.title || 'Téma').trim(),
            content: String(t.content || '').trim()
          });
        }
      });
      
      await pushToCloud();
      alert(`🎉 Hotovo! Sešit "${subName}" byl rozdělen do přehledných kapitol a podtémat.`);
      nav('home');
    }

    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const maxDimension = 1200;
            if (w > maxDimension || h > maxDimension) {
              if (w > h) { h = Math.round((h * maxDimension) / w); w = maxDimension; }
              else { w = Math.round((w * maxDimension) / h); h = maxDimension; }
            }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

        state.currentTestPrompt = response;
        app.innerHTML = `
          <button onclick="nav('zkouseniHub')" class="text-xs text-slate-400 mb-3">← Zpět</button>
          <h2 class="text-2xl font-black mb-3 text-purple-400">Test nanečisto</h2>
          <div class="bg-cardBg p-4 rounded-xl border border-slate-800 text-sm text-slate-300 mb-4 leading-relaxed">${cleanAndFormatText(response)}</div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Tvoje odpovědi:</label>
          <textarea id="studentAnswers" rows="5" placeholder="Napiš sem své odpovědi (1..., 2...)..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 mb-4"></textarea>
          <button onclick="evaluateTestSubmit()" class="w-full py-4 bg-purple-600 font-bold rounded-xl active:scale-98">Vyhodnotit a oznámkovat</button>
        `;
      } catch(e) {
        alert('Chyba: ' + e.message);
        nav('zkouseniHub');
      }
    }

    async function evaluateTestSubmit() {
      const answers = document.getElementById('studentAnswers')?.value;
      if (!answers) { alert('Nejprve napiš své odpovědi!'); return; }
      const app = document.getElementById('app');
      app.innerHTML = `<div class="text-center py-20"><div class="animate-spin text-4xl mb-4">⚡</div><p class="text-sm text-slate-400">Groq opravuje test a počítá známku...</p></div>`;
      
      const prompt = `TEST:\n${state.currentTestPrompt}\n\nODPOVĚDI STUDENTA:\n${answers}\n\nPODKLADY Z LÁTKY:\n${getCombinedNotes()}`;
      try {
        const { text: evaluation } = await executeGroqChat([
          { role: "system", content: "Jsi učitel. Zhodnoť odpovědi, dej známku 1-5 a vysvětli chyby. Nepoužívej hvězdičky pro nadpisy." },
          { role: "user", content: prompt }
        ]);
        nav('result', { title: 'Výsledek testu', content: evaluation });
      } catch(e) {
        alert('Chyba: ' + e.message);
        nav('zkouseniHub');
      }
    }

    function startOralExam() {
      state.oralExamHistory = [{ role: 'assistant', content: 'Dobrý den. Pojďme k tabuli. Co mi dokážeš říct k prvnímu z vybraných témat?' }];
      nav('oralExam');
    }

    function renderOralExamView() {
      const app = document.getElementById('app');
      let chatMsgs = state.oralExamHistory.map(m => `
        <div class="p-3 rounded-xl text-sm ${m.role === 'assistant' ? 'bg-purple-900/30 border border-purple-800/40 mr-6' : 'bg-slate-800 ml-6 text-right'}">
          <span class="block text-[10px] font-bold text-slate-400 mb-1">${m.role === 'assistant' ? '👨‍🏫 Učitel' : '🧑‍🎓 Ty'}</span>
          <div>${cleanAndFormatText(m.content)}</div>
        </div>
      `).join('');
      app.innerHTML = `
        <button onclick="nav('zkouseniHub')" class="text-xs text-slate-400 mb-3">← Ukončit zkoušení</button>
        <h2 class="text-xl font-bold mb-3">Ústní zkoušení</h2>
        <div class="space-y-3 mb-4 max-h-[55vh] overflow-y-auto pr-1">${chatMsgs}</div>
        <div class="flex gap-2">
          <input id="oralInput" type="text" placeholder="Tvoje odpověď (nebo instrukce učiteli)..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 text-sm" onkeydown="if(event.key==='Enter') sendOralAnswer()">
          <button onclick="sendOralAnswer()" class="px-4 py-3 bg-purple-600 rounded-xl font-bold text-sm">Odpovědět</button>
        </div>
      `;
    }

    async function sendOralAnswer() {
      const input = document.getElementById('oralInput');
      const val = input?.value.trim();
      if (!val) return;
      state.oralExamHistory.push({ role: 'user', content: val });
      renderOralExamView();
      try {
        const { text: reply } = await executeGroqChat([
          { role: "system", content: `Jsi učitel u tabule. V 2-3 větách zhodnoť odpověď a polož další otázku k látce. Nepoužívej hvězdičky.\n${getCombinedNotes()}` },
          ...state.oralExamHistory
        ]);
        state.oralExamHistory.push({ role: 'assistant', content: reply });
        renderOralExamView();
      } catch(e) { alert(e.message); }
    }

    function renderChatView() {
      const app = document.getElementById('app');
      let msgs = state.chatHistory.map(m => `
        <div class="p-3 rounded-xl text-sm ${m.role === 'assistant' ? 'bg-blue-900/30 border border-blue-800/40 mr-6' : 'bg-slate-800 ml-6 text-right'}">
          <div>${cleanAndFormatText(m.content)}</div>
        </div>
      `).join('');
      app.innerHTML = `
        <button onclick="nav('uceniHub')" class="text-xs text-slate-400 mb-3">← Zpět</button>
        <h2 class="text-xl font-bold mb-3">Doučovatel</h2>
        <div class="space-y-3 mb-4 max-h-[55vh] overflow-y-auto">${msgs || '<p class="text-xs text-slate-500">Zeptej se na cokoliv z vybraných kapitol...</p>'}</div>
        <div class="flex gap-2">
          <input id="chatInput" type="text" placeholder="Na co se chceš zeptat?..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 text-sm" onkeydown="if(event.key==='Enter') sendChatMessage()">
          <button onclick="sendChatMessage()" class="px-4 py-3 bg-blue-600 rounded-xl font-bold text-sm">Odeslat</button>
        </div>
      `;
    }

    async function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const val = input?.value.trim();
      if (!val) return;
      state.chatHistory.push({ role: 'user', text: val });
      renderChatView();
      try {
        const { text: reply } = await executeGroqChat([
          { role: "system", content: `Jsi trpělivý osobní lektor. Odpovídej věcně a bez zbytečných hvězdiček k této látce:\n${getCombinedNotes()}` },
          ...state.chatHistory
        ]);
        state.chatHistory.push({ role: 'assistant', content: reply });
        renderChatView();
      } catch(e) { alert(e.message); }
    }

    function renderOutputView({ title, content }) {
      document.getElementById('app').innerHTML = `
        <button onclick="nav('home')" class="text-xs text-slate-400 mb-3">← Domů</button>
        <h2 class="text-2xl font-black mb-3 text-amber-400">${title}</h2>
        
        <div class="bg-cardBg p-5 md:p-6 rounded-2xl border border-slate-800 text-sm leading-relaxed text-slate-200">
          ${cleanAndFormatText(content)}
        </div>

        <div class="mt-4 p-4 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl">
          <label class="block text-xs font-bold text-amber-300 uppercase mb-1.5">✏️ Chceš na tomto výsledku něco změnit?</label>
          <div class="flex gap-2">
            <input id="refineInput" type="text" placeholder="např. zkrať to / vysvětli víc bod 2 / přidej další mnemotechniku..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 text-xs text-slate-100" onkeydown="if(event.key==='Enter') refineCurrentResult('${title}')">
            <button onclick="refineCurrentResult('${title}')" class="px-4 py-2.5 bg-amber-600 hover:bg-amber-500 font-bold rounded-xl text-xs active:scale-95 transition">
              ⚡ Upravit
            </button>
          </div>
        </div>

        <button onclick="nav('home')" class="w-full mt-4 py-3.5 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-sm">Hotovo</button>
      `;
    }

    async function refineCurrentResult(title) {
      const input = document.getElementById('refineInput');
      const userInstruction = input?.value.trim();
      if (!userInstruction) return;

      const app = document.getElementById('app');
      app.innerHTML = `<div class="text-center py-20"><div class="animate-spin text-4xl mb-4">⚡</div><p class="text-sm text-slate-400">Přepracovávám podle tvého přání...</p></div>`;

      try {
        const { text: newResponse } = await executeGroqChat([
          { role: "system", content: "Jsi asistent pro studium. Uprav předchozí výstup přesně podle nového přání studenta. Nepoužívej hvězdičky pro nadpisy. Můžeš zachovat rámečky [EXTRA:] a [TIP NA PAMĚŤ:]." },
          { role: "user", content: `Původní podklady látky:\n${getCombinedNotes()}\n\nNové přání studenta k úpravě: ${userInstruction}` }
        ]);
        renderOutputView({ title: title + ' (Upraveno)', content: newResponse });
      } catch(e) {
        alert('Chyba: ' + e.message);
        nav('home');
      }
    }

    function renderVkladani() {
      const app = document.getElementById('app');
      let subOptions = state.subjects.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
      app.innerHTML = `
        <button onclick="nav('home')" class="text-xs text-slate-400 mb-3">← Domů</button>
        <h2 class="text-2xl font-black">Vložit celý sešit</h2>
        <p class="text-slate-400 text-xs mb-5">AI sama rozdělí i obří sešit na kapitoly a podtémata.</p>
        <div class="space-y-4 bg-cardBg p-5 rounded-2xl border border-slate-800 shadow-xl">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">1. Předmět</label>
            ${state.subjects.length > 0 ? `
              <div class="mb-2">
                <select id="selectSub" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200" onchange="toggleCustomSub(this)">
                  <option value="">-- Vyber existující předmět --</option>
                  ${subOptions}
                  <option value="__NEW__">➕ Zadat nový předmět...</option>
                </select>
              </div>
            ` : ''}
            <input id="inputSubName" type="text" placeholder="Zadej název předmětu (např. Dějepis)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 ${state.subjects.length > 0 ? 'hidden' : ''}">
          </div>
          <div class="pt-3 border-t border-slate-800">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Možnost A: Vybrat fotky sešitu (Galerie / Foťák)</label>
            <label class="flex flex-col items-center justify-center p-5 bg-slate-800/80 border border-dashed border-slate-600 rounded-xl cursor-pointer hover:border-amber-400 transition">
              <span class="text-3xl">📸</span>
              <span class="text-sm font-bold mt-2 text-amber-400">Vybrat fotky sešitu</span>
              <span class="text-[10px] text-slate-400 mt-1">Automaticky optimalizováno a komprimováno</span>
              <input id="multiImagesInput" type="file" accept="image/*" multiple class="hidden" onchange="handleMultipleImages(this)">
            </label>
          </div>
          <div class="pt-3 border-t border-slate-800">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Možnost B: Vložit text z Apple Notes</label>
            <textarea id="inputTextFull" rows="8" placeholder="Sem vlož kompletní sešit se všemi nadpisy..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-slate-200"></textarea>
            <button onclick="processFullTextNotebook()" id="saveTextBtn" class="w-full mt-3 py-4 bg-emerald-600 font-bold rounded-xl active:scale-98 transition shadow-lg shadow-emerald-600/30">
              ⚡ Rozdělit sešit na kapitoly
            </button>
          </div>
        </div>
      `;
    }

    function toggleCustomSub(selectEl) {
      const input = document.getElementById('inputSubName');
      if (selectEl && input) {
        if (selectEl.value === '__NEW__') { input.classList.remove('hidden'); input.focus(); }
        else { input.classList.add('hidden'); }
      }
    }

    function getResolvedSubjectName() {
      const select = document.getElementById('selectSub');
      const input = document.getElementById('inputSubName');
      if (select && select.value && select.value !== '__NEW__') return select.value.trim();
      if (input && input.value) return input.value.trim();
      return '';
    }

    function renderManageSubjects() {
      const app = document.getElementById('app');
      let html = state.subjects.map(sub => `
        <div class="bg-cardBg p-4 rounded-xl border border-slate-800 mb-3">
          <div class="flex justify-between items-center mb-2">
            <h3 class="font-bold text-amber-400">${sub.name}</h3>
            <button onclick="deleteSubject('${sub.id}')" class="text-xs text-red-400">Smazat sešit</button>
          </div>
          <div class="space-y-1">
            ${(sub.topics || []).map(t => `
              <div class="flex justify-between text-xs p-2 bg-slate-800 rounded">
                <span>📁 ${t.chapter || ''} / 📌 ${t.title || 'Kapitola'}</span>
                <button onclick="deleteTopic('${sub.id}', '${t.id}')" class="text-red-400">Odstranit</button>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
      app.innerHTML = `
        <button onclick="nav('home')" class="text-xs text-slate-400 mb-3">← Domů</button>
        <h2 class="text-2xl font-black mb-4">Správa sešitů a kapitol</h2>
        ${html || '<p class="text-xs text-slate-500">Zatím žádné sešity.</p>'}
      `;
    }

    async function deleteSubject(id) {
      if (confirm('Smazat celý sešit?')) { state.subjects = state.subjects.filter(s => s && s.id !== id); await pushToCloud(); renderManageSubjects(); }
    }
    async function deleteTopic(subId, topId) {
      const sub = state.subjects.find(s => s && s.id === subId);
      if (sub && Array.isArray(sub.topics)) { sub.topics = sub.topics.filter(t => t && t.id !== topId); await pushToCloud(); renderManageSubjects(); }
    }

    function renderSettings() {
      document.getElementById('app').innerHTML = `
        <button onclick="nav('home')" class="text-xs text-slate-400 mb-3">← Domů</button>
        <h2 class="text-2xl font-black mb-1">Nastavení</h2>
        <p class="text-xs text-slate-400 mb-4">StudyApp v25.0 SafeToken</p>

        <div class="bg-cardBg p-4 rounded-xl border border-slate-800 space-y-3 mb-5">
          <label class="block text-xs font-bold text-slate-400 uppercase">GitHub Cloud Token (Synchronizace)</label>
          <input id="userGhTokenInput" type="password" value="${state.ghToken}" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 font-mono">
          <button onclick="saveUserGhToken()" class="w-full py-2 bg-blue-600 hover:bg-blue-500 font-bold rounded-lg text-xs transition">
            💾 Uložit token do tohoto zařízení
          </button>
        </div>

        <div class="bg-cardBg p-4 rounded-xl border border-slate-800 space-y-3 mb-5">
          <h3 class="text-xs font-bold text-slate-400 uppercase">Synchronizace sešitů</h3>
          <button onclick="manualPush()" class="w-full py-3 bg-emerald-600/30 border border-emerald-500 text-emerald-300 font-bold rounded-lg text-xs">
            ☁️ Odeslat data z tohoto zařízení na GitHub
          </button>
          <button onclick="manualPull()" class="w-full py-3 bg-blue-600/30 border border-blue-500 text-blue-300 font-bold rounded-lg text-xs">
            🔄 Stáhnout data z GitHubu do tohoto zařízení
          </button>
          <div id="syncResult" class="text-xs font-medium"></div>
        </div>

        <button onclick="clearStorage()" class="w-full py-2 bg-red-950/40 border border-red-800/60 text-red-300 font-semibold rounded-xl text-xs">
          🧹 Vyčistit data v tomto zařízení
        </button>
      `;
    }

    function saveUserGhToken() {
      const val = document.getElementById('userGhTokenInput')?.value.trim();
      if (!val) { alert('Zadej token!'); return; }
      state.ghToken = val;
      localStorage.setItem('github_token', val);
      alert('✅ Token uložen!');
    }

    async function manualPush() {
      const div = document.getElementById('syncResult');
      div.innerHTML = '<span class="text-blue-400">⏳ Odesílám sešity na GitHub...</span>';
      const res = await pushToCloud();
      if (res.success) {
        div.innerHTML = '<span class="text-emerald-400 font-bold">✅ Data byla úspěšně nahrána na GitHub! Budou i na iPadu a iPhonu.</span>';
      } else {
        div.innerHTML = `<span class="text-red-400 font-bold">❌ Chyba nahrávání: ${res.msg}</span>`;
      }
    }

    async function manualPull() {
      const div = document.getElementById('syncResult');
      div.innerHTML = '<span class="text-blue-400">⏳ Stahuji data z GitHubu...</span>';
      const ok = await pullFromCloud();
      if (ok) {
        div.innerHTML = `<span class="text-emerald-400 font-bold">✅ Úspěšně staženo! Nalezeno ${state.subjects.length} sešitů.</span>`;
        setTimeout(() => nav('home'), 1000);
      } else {
        div.innerHTML = '<span class="text-amber-400 font-bold">⚠️ Na GitHubu zatím není žádný uložený sešit.</span>';
      }
    }

    function clearStorage() {
      if (confirm('Opravdu vymazat?')) { localStorage.removeItem('study_data'); state.subjects = []; alert('Vyčištěno!'); nav('home'); }
    }

    async function initApp() {
      setupAppleHomeScreenIcon();
      if (state.subjects.length === 0) {
        document.getElementById('app').innerHTML = `
          <div class="text-center py-24">
            <div class="animate-spin text-4xl mb-4">☁️</div>
            <h2 class="text-lg font-bold">Stahuji tvoje sešity z cloudu...</h2>
            <p class="text-xs text-slate-400 mt-1">Synchronizace PC ↔ iPad ↔ iPhone</p>
          </div>
        `;
        await pullFromCloud();
      } else {
        pullFromCloud(true);
      }
      nav('home');
    }

    initApp();
  </script>
</body>
</html>
