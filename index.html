<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StudyApp v4.0</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { darkBg: '#090d16', cardBg: '#131b2e' } } }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col font-sans select-none pb-12">

  <!-- TOP BAR -->
  <header class="p-4 pt-10 border-b border-slate-800/80 flex justify-between items-center bg-darkBg/90 backdrop-blur-md sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <button onclick="nav('home')" class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent flex items-center gap-1.5">
        <span>🧠</span> StudyApp
      </button>
      <span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-bold border border-amber-500/40">v4.0 AutoModel</span>
    </div>
    <div class="flex gap-2 items-center">
      <span id="cloudBadge" class="text-[11px] px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 font-semibold border border-slate-700/60 flex items-center gap-1">
        <span>💾</span> Lokální
      </span>
      <button onclick="nav('manage')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 text-xs font-semibold text-slate-300">📚 Sešity</button>
      <button onclick="nav('settings')" class="p-1.5 rounded-lg bg-slate-800 text-slate-300">⚙️</button>
    </div>
  </header>

  <main id="app" class="flex-1 p-5 max-w-xl mx-auto w-full">
    <!-- Dyn Content -->
  </main>

  <script>
    const CONFIG = {
      owner: 'menexsplayground',
      repo: 'study-app',
      dataFile: 'data.json'
    };

    function loadCleanSubjects() {
      try {
        const raw = localStorage.getItem('study_data');
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(s => s && typeof s === 'object' && s.name).map(s => ({
          id: s.id || ('sub_' + Date.now()),
          name: String(s.name).trim(),
          topics: Array.isArray(s.topics) ? s.topics.filter(t => t && (t.title || t.content)) : []
        }));
      } catch (e) {
        return [];
      }
    }

    const state = {
      apiKey: (localStorage.getItem('gemini_key') || '').trim(),
      ghToken: (localStorage.getItem('github_token') || '').trim(),
      ghSha: localStorage.getItem('github_data_sha') || null,
      subjects: loadCleanSubjects(),
      selectedTopics: [],
      currentMode: null,
      chatHistory: [],
      oralExamHistory: [],
      activeModel: 'gemini-2.0-flash'
    };

    function setCloudStatus(type, text) {
      const badge = document.getElementById('cloudBadge');
      if (!badge) return;
      if (type === 'syncing') {
        badge.className = 'text-[11px] px-2.5 py-1 rounded-full bg-blue-900/40 text-blue-300 font-semibold border border-blue-700/60 flex items-center gap-1';
        badge.innerHTML = `<span>⏳</span> ${text}`;
      } else if (type === 'synced') {
        badge.className = 'text-[11px] px-2.5 py-1 rounded-full bg-emerald-900/40 text-emerald-300 font-semibold border border-emerald-700/60 flex items-center gap-1';
        badge.innerHTML = `<span>☁️</span> ${text}`;
      } else {
        badge.className = 'text-[11px] px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 font-semibold border border-slate-700/60 flex items-center gap-1';
        badge.innerHTML = `<span>💾</span> ${text}`;
      }
    }

    async function pullFromCloud() {
      if (!state.ghToken) return;
      setCloudStatus('syncing', 'Stahuji z cloudu...');
      try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.dataFile}`, {
          headers: {
            'Authorization': `token ${state.ghToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        if (res.status === 200) {
          const data = await res.json();
          state.ghSha = data.sha;
          localStorage.setItem('github_data_sha', data.sha);
          const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
          const list = JSON.parse(decoded);
          if (Array.isArray(list)) {
            state.subjects = list;
            localStorage.setItem('study_data', JSON.stringify(state.subjects));
            setCloudStatus('synced', 'Synchronizováno');
            if (document.getElementById('statsSubCount')) renderHome();
          }
        } else if (res.status === 404) {
          setCloudStatus('synced', 'Nový cloud');
        }
      } catch (err) {
        console.error(err);
        setCloudStatus('error', 'Chyba cloudu');
      }
    }

    async function pushToCloud() {
      localStorage.setItem('study_data', JSON.stringify(state.subjects));
      if (!state.ghToken) {
        setCloudStatus('local', 'Pouze v mobilu');
        return;
      }

      setCloudStatus('syncing', 'Ukládám do cloudu...');
      try {
        const contentStr = JSON.stringify(state.subjects, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(contentStr)));

        const payload = {
          message: 'Aktualizace sešitů (StudyApp Cloud)',
          content: encodedContent
        };
        if (state.ghSha) payload.sha = state.ghSha;

        const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.dataFile}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${state.ghToken}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const resData = await res.json();
          state.ghSha = resData.content.sha;
          localStorage.setItem('github_data_sha', state.ghSha);
          setCloudStatus('synced', 'Uloženo na web');
        } else {
          setCloudStatus('error', 'Chyba ukládání');
        }
      } catch (err) {
        console.error(err);
        setCloudStatus('error', 'Offline');
      }
    }

    function getTotalTopicsCount() {
      return state.subjects.reduce((sum, s) => sum + (s && s.topics ? s.topics.length : 0), 0);
    }

    function nav(screen, param = null) {
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (!state.apiKey && screen !== 'settings') {
        renderSettings('Nejprve vlož svůj Gemini API klíč pro fungování AI.');
        return;
      }

      switch(screen) {
        case 'home': renderHome(); break;
        case 'topicSelect': renderTopicSelect(param); break;
        case 'uceniHub': renderUceniHub(); break;
        case 'zkouseniHub': renderZkouseniHub(); break;
        case 'vkladani': renderVkladani(); break;
        case 'manage': renderManageSubjects(); break;
        case 'settings': renderSettings(); break;
        case 'result': renderOutputView(param); break;
        case 'chat': renderChatView(); break;
        case 'flashcards': renderFlashcardsView(param); break;
        case 'oralExam': renderOralExamView(); break;
      }
    }

    // --- 1. DOMOV ---
    function renderHome() {
      const app = document.getElementById('app');
      const totalCount = getTotalTopicsCount();

      app.innerHTML = `
        <div class="mt-4 text-center">
          <h1 class="text-3xl font-extrabold tracking-tight">Co chceš dnes dělat?</h1>
          <p class="text-slate-400 text-xs mt-1">
            <span id="statsSubCount" class="text-blue-400 font-bold">${state.subjects.length} sešitů</span>, 
            <span class="text-blue-400 font-bold">${totalCount} kapitol</span>
            ${state.ghToken ? '• <span class="text-emerald-400 font-semibold">☁️ Cloud aktivní</span>' : '• <span class="text-amber-400 font-semibold">⚠️ Cloud vypnut</span>'}
          </p>
        </div>

        <div class="grid gap-4 mt-8">
          <button onclick="nav('topicSelect', 'uceni')" class="p-6 rounded-2xl bg-cardBg border border-blue-500/30 flex items-center gap-4 text-left hover:border-blue-500 active:scale-95 transition">
            <span class="text-4xl">📖</span>
            <div>
              <h2 class="text-xl font-bold text-blue-400">Učit se</h2>
              <p class="text-slate-400 text-xs mt-0.5">Shrnutí, ELI5, rychlokurz před testem a chat s doučovatelem.</p>
            </div>
          </button>

          <button onclick="nav('topicSelect', 'zkouseni')" class="p-6 rounded-2xl bg-cardBg border border-purple-500/30 flex items-center gap-4 text-left hover:border-purple-500 active:scale-95 transition">
            <span class="text-4xl">🎯</span>
            <div>
              <h2 class="text-xl font-bold text-purple-400">Zkoušet</h2>
              <p class="text-slate-400 text-xs mt-0.5">Flashcards, test nanečisto nebo simulované ústní zkoušení.</p>
            </div>
          </button>

          <button onclick="nav('vkladani')" class="p-6 rounded-2xl bg-cardBg border border-emerald-500/30 flex items-center gap-4 text-left hover:border-emerald-500 active:scale-95 transition">
            <span class="text-4xl">📥</span>
            <div>
              <h2 class="text-xl font-bold text-emerald-400">Vložit celý sešit</h2>
              <p class="text-slate-400 text-xs mt-0.5">Vlož text nebo fotky – AI sama pozná nadpisy a rozdělí látku.</p>
            </div>
          </button>
        </div>
      `;
    }

    // --- 2. VÝBĚR TÉMAT ---
    function renderTopicSelect(targetMode) {
      state.currentMode = targetMode;
      const app = document.getElementById('app');

      if (state.subjects.length === 0 || getTotalTopicsCount() === 0) {
        app.innerHTML = `
          <div class="text-center py-12">
            <span class="text-4xl">📂</span>
            <p class="text-slate-300 font-bold mt-3 mb-1">Nemáš uložené žádné sešity</p>
            <p class="text-slate-400 text-xs mb-5">Začni tím, že vložíš celý sešit naráz.</p>
            <button onclick="nav('vkladani')" class="px-5 py-3 rounded-xl bg-emerald-600 font-bold text-sm">Vložit první sešit</button>
          </div>
        `;
        return;
      }

      let subjectsHtml = '';
      state.subjects.forEach(sub => {
        if (!sub || !sub.topics || sub.topics.length === 0) return;
        let topicsHtml = '';
        sub.topics.forEach(top => {
          if (!top) return;
          const isChecked = state.selectedTopics.some(t => t && t.id === top.id) ? 'checked' : '';
          topicsHtml += `
            <label class="flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 border border-slate-700/50 cursor-pointer active:bg-slate-700">
              <input type="checkbox" value="${top.id}" data-sub="${sub.id}" class="w-5 h-5 accent-blue-500 rounded topic-cb" ${isChecked}>
              <div class="flex-1">
                <span class="text-sm font-semibold text-slate-100 block">📌 ${top.title || 'Téma'}</span>
                <span class="text-[10px] text-slate-400 line-clamp-1">${(top.content || '').substring(0, 65)}...</span>
              </div>
            </label>
          `;
        });

        subjectsHtml += `
          <div class="mb-5 bg-cardBg p-4 rounded-2xl border border-slate-800">
            <div class="flex justify-between items-center mb-3">
              <h3 class="font-bold text-md text-blue-400">${sub.name}</h3>
              <button onclick="toggleAllInSub('${sub.id}')" class="text-xs text-slate-400 hover:text-slate-200">Vybrat vše</button>
            </div>
            <div class="grid gap-2">${topicsHtml}</div>
          </div>
        `;
      });

      app.innerHTML = `
        <button onclick="nav('home')" class="text-xs text-slate-400 mb-3">← Domů</button>
        <h2 class="text-2xl font-black mb-1">Vyber témata / nadpisy</h2>
        <p class="text-slate-400 text-xs mb-5">Zaškrtni úseky látky, ze kterých ${targetMode === 'uceni' ? 'se chceš učit' : 'chceš být zkoušen'}.</p>
        
        <div>${subjectsHtml}</div>

        <div class="sticky bottom-4 pt-2">
          <button onclick="confirmSelectedTopics()" class="w-full py-4 rounded-xl bg-blue-600 font-bold shadow-lg shadow-blue-600/30 active:scale-98 transition">
            Pokračovat s vybranou látkou
          </button>
        </div>
      `;
    }

    function toggleAllInSub(subId) {
      const cbs = document.querySelectorAll(`.topic-cb[data-sub="${subId}"]`);
      const allChecked = Array.from(cbs).every(c => c.checked);
      cbs.forEach(c => c.checked = !allChecked);
    }

    function confirmSelectedTopics() {
      const checkedBoxes = document.querySelectorAll('.topic-cb:checked');
      if (checkedBoxes.length === 0) {
        alert('Vyber alespoň jeden nadpis / téma!');
        return;
      }

      state.selectedTopics = [];
      checkedBoxes.forEach(cb => {
        const subId = cb.getAttribute('data-sub');
        const topId = cb.value;
        const sub = state.subjects.find(s => s && s.id === subId);
        const top = sub && sub.topics ? sub.topics.find(t => t && t.id === topId) : null;
        if (top) state.selectedTopics.push(top);
      });

      if (state.currentMode === 'uceni') nav('uceniHub');
      else nav('zkouseniHub');
    }

    function getCombinedNotes() {
      return state.selectedTopics.map(t => `### ${t.title || 'Látka'}\n${t.content || ''}`).join('\n\n');
    }

    // --- 3. REŽIMY UČENÍ ---
    function renderUceniHub() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <button onclick="nav('topicSelect', 'uceni')" class="text-xs text-slate-400 mb-3">← Změnit okruhy</button>
        <h2 class="text-2xl font-black">Režimy učení</h2>
        <p class="text-xs text-blue-400 mb-5 font-semibold">Vybráno kapitol: ${state.selectedTopics.length}</p>

        <div class="grid gap-3">
          <button onclick="runAiStudy('shrnuti')" class="p-4 bg-cardBg border border-slate-800 rounded-xl flex items-center gap-3 text-left active:scale-98 transition">
            <span class="text-2xl">📑</span>
            <div><h3 class="font-bold">Shrnutí látky</h3><p class="text-xs text-slate-400">Přehledný strukturovaný výtah v bodech.</p></div>
          </button>

          <button onclick="runAiStudy('eli5')" class="p-4 bg-cardBg border border-slate-800 rounded-xl flex items-center gap-3 text-left active:scale-98 transition">
            <span class="text-2xl">👶</span>
            <div><h3 class="font-bold">Nauč mě jako pro hlupáka (ELI5)</h3><p class="text-xs text-slate-400">Vtipné analogie a metafory ze života.</p></div>
          </button>

          <button onclick="runAiStudy('predzvonici')" class="p-4 bg-cardBg border border-slate-800 rounded-xl flex items-center gap-3 text-left active:scale-98 transition">
            <span class="text-2xl">⚡</span>
            <div><h3 class="font-bold text-amber-400">Předzvonící rychloučení</h3><p class="text-xs text-slate-400">3 minuty před testem: nejdůležitější pojmy a chytáky.</p></div>
          </button>

          <button onclick="nav('chat')" class="p-4 bg-cardBg border border-slate-800 rounded-xl flex items-center gap-3 text-left active:scale-98 transition">
            <span class="text-2xl">💬</span>
            <div><h3 class="font-bold text-blue-400">Osobní doučovatel</h3><p class="text-xs text-slate-400">Ptej se AI přímo na tuto vybranou látku.</p></div>
          </button>
        </div>
      `;
    }

    // --- 4. REŽIMY ZKOUŠENÍ ---
    function renderZkouseniHub() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <button onclick="nav('topicSelect', 'zkouseni')" class="text-xs text-slate-400 mb-3">← Změnit okruhy</button>
        <h2 class="text-2xl font-black">Zkoušení a testy</h2>
        <p class="text-xs text-purple-400 mb-5 font-semibold">Vybráno kapitol: ${state.selectedTopics.length}</p>

        <div class="grid gap-3">
          <button onclick="startFlashcards()" class="p-4 bg-cardBg border border-slate-800 rounded-xl flex items-center gap-3 text-left active:scale-98 transition">
            <span class="text-2xl">🎴</span>
            <div><h3 class="font-bold">Flashcards (Otáčecí kartičky)</h3><p class="text-xs text-slate-400">Otázka na líci, odpověď na rubu.</p></div>
          </button>

          <button onclick="runAiTest()" class="p-4 bg-cardBg border border-slate-800 rounded-xl flex items-center gap-3 text-left active:scale-98 transition">
            <span class="text-2xl">📝</span>
            <div><h3 class="font-bold">Test nanečisto</h3><p class="text-xs text-slate-400">Vygeneruje otázky a na konci tě oznámkuje.</p></div>
          </button>

          <button onclick="startOralExam()" class="p-4 bg-cardBg border border-slate-800 rounded-xl flex items-center gap-3 text-left active:scale-98 transition">
            <span class="text-2xl">🎙️</span>
            <div><h3 class="font-bold text-purple-400">Ústní zkoušení (v textu)</h3><p class="text-xs text-slate-400">Učitel tě zkouší u tabule, reaguje na tvé odpovědi.</p></div>
          </button>
        </div>
      `;
    }

    // --- 5. VKLÁDÁNÍ LÁTKY ---
    function renderVkladani() {
      const app = document.getElementById('app');
      let subOptions = state.subjects.map(s => `<option value="${s.name}">${s.name}</option>`).join('');

      app.innerHTML = `
        <button onclick="nav('home')" class="text-xs text-slate-400 mb-3">← Domů</button>
        <h2 class="text-2xl font-black">Vložit celý sešit</h2>
        <p class="text-slate-400 text-xs mb-5">AI sama rozpozná nadpisy a rozdělí sešit na kapitoly.</p>

        <div class="space-y-4 bg-cardBg p-5 rounded-2xl border border-slate-800 shadow-xl">
          
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">1. Předmět</label>
            ${state.subjects.length > 0 ? `
              <div class="mb-2">
                <select id="selectSub" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200" onchange="toggleCustomSub(this)">
                  <option value="">-- Vyber existující předmět --</option>
                  ${subOptions}
                  <option value="__NEW__">➕ Zadat nový předmět...</option>
                </select>
              </div>
            ` : ''}
            <input id="inputSubName" type="text" placeholder="Zadej název předmětu (např. Dějepis)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 ${state.subjects.length > 0 ? 'hidden' : ''}">
          </div>

          <!-- MOŽNOST A: FOTKY -->
          <div class="pt-3 border-t border-slate-800">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Možnost A: Vybrat fotky sešitu</label>
            <p class="text-[11px] text-slate-400 mb-2">Můžeš označit i 10–20 fotek najednou v galerii!</p>
            <label class="flex flex-col items-center justify-center p-5 bg-slate-800/80 border border-dashed border-slate-600 rounded-xl cursor-pointer active:scale-98 transition">
              <span class="text-3xl">📸</span>
              <span class="text-sm font-bold mt-2 text-blue-400">Vybrat fotky sešitu</span>
              <span class="text-[10px] text-slate-400 mt-1">Podporuje hromadný výběr</span>
              <input id="multiImagesInput" type="file" accept="image/*" multiple class="hidden" onchange="handleMultipleImages(this)">
            </label>
          </div>

          <!-- MOŽNOST B: APPLE NOTES -->
          <div class="pt-3 border-t border-slate-800">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Možnost B: Vložit celý sešit z Apple Notes</label>
            <p class="text-[11px] text-slate-400 mb-2">V poznámkách dej "Vybrat vše", zkopíruj a vlož sem celý sešit najednou.</p>
            <textarea id="inputTextFull" rows="8" placeholder="Sem vlož kompletní sešit se všemi nadpisy..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-slate-200"></textarea>
            
            <button onclick="processFullTextNotebook()" id="saveTextBtn" class="w-full mt-3 py-4 bg-emerald-600 font-bold rounded-xl active:scale-98 transition shadow-lg shadow-emerald-600/30">
              🚀 Nechat AI rozdělit sešit na témata
            </button>
          </div>

        </div>
      `;
    }

    function toggleCustomSub(selectEl) {
      const input = document.getElementById('inputSubName');
      if (selectEl && input) {
        if (selectEl.value === '__NEW__') {
          input.classList.remove('hidden');
          input.focus();
        } else {
          input.classList.add('hidden');
        }
      }
    }

    function getResolvedSubjectName() {
      const select = document.getElementById('selectSub');
      const input = document.getElementById('inputSubName');
      if (select && select.value && select.value !== '__NEW__') {
        return select.value.trim();
      }
      if (input && input.value) {
        return input.value.trim();
      }
      return '';
    }

    // --- DYNAMICKÉ ZJIŠTĚNÍ DOSTUPNÉHO MODELU OD GOOGLU ---
    async function getActiveGeminiModel(key) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.models) {
            const preferred = ['gemini-2.0-flash', 'gemini-2.5-flash', 'gemini-1.5-flash-latest'];
            for (let p of preferred) {
              if (data.models.some(m => m.name === 'models/' + p)) {
                return p;
              }
            }
            const anyFlash = data.models.find(m => m.name.includes('flash') && m.supportedGenerationMethods?.includes('generateContent'));
            if (anyFlash) return anyFlash.name.replace('models/', '');
          }
        }
      } catch (e) {}
      return 'gemini-2.0-flash';
    }

    async function callGeminiApi({ systemPrompt, contents, isJson = false }) {
      const key = (state.apiKey || '').trim();
      if (!key) {
        throw new Error('Chybí Gemini API klíč! Jdi do Nastavení ⚙️ a vlož ho.');
      }

      const activeModel = await getActiveGeminiModel(key);
      const MODELS = [activeModel, 'gemini-2.0-flash', 'gemini-2.5-flash', 'gemini-1.5-flash-latest'];
      let lastError = null;

      for (const model of [...new Set(MODELS)]) {
        try {
          const bodyPayload = {
            contents: contents,
            generationConfig: { temperature: 0.2 }
          };

          if (systemPrompt) {
            bodyPayload.system_instruction = { parts: [{ text: systemPrompt }] };
          }

          if (isJson) {
            bodyPayload.generationConfig.response_mime_type = "application/json";
          }

          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyPayload)
          });

          const data = await res.json();

          if (res.status === 404 || (data && data.error && (data.error.code === 404 || (data.error.message && data.error.message.includes('not found'))))) {
            lastError = new Error(data && data.error ? data.error.message : `Model ${model} nebyl nalezen.`);
            continue;
          }

          if (!res.ok || (data && data.error)) {
            const msg = (data && data.error && data.error.message) ? data.error.message : `Chyba API (${res.status})`;
            throw new Error(`Google API: ${msg}`);
          }

          if (!data || !data.candidates || !data.candidates[0] || !data.candidates[0].content || !data.candidates[0].content.parts || !data.candidates[0].content.parts[0] || !data.candidates[0].content.parts[0].text) {
            throw new Error('Gemini nevrátil žádný text.');
          }

          return data.candidates[0].content.parts[0].text;
        } catch (err) {
          if (err.message && err.message.includes('not found')) {
            lastError = err;
            continue;
          }
          throw err;
        }
      }

      throw lastError || new Error('Žádný z Gemini modelů neodpověděl.');
    }

    async function callGemini(systemPrompt, userPrompt, isJson = false) {
      return await callGeminiApi({
        systemPrompt,
        contents: [{ parts: [{ text: userPrompt }] }],
        isJson
      });
    }

    function extractTopicsListFromRawJson(rawText) {
      let cleaned = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      let parsed = JSON.parse(cleaned);

      if (Array.isArray(parsed)) return parsed;
      if (parsed && typeof parsed === 'object') {
        for (let k of Object.keys(parsed)) {
          if (Array.isArray(parsed[k])) return parsed[k];
        }
        if (parsed.title || parsed.content) return [parsed];
      }
      return [];
    }

    async function processFullTextNotebook() {
      const subName = getResolvedSubjectName();

      if (!subName) { alert('Nejprve nahoře zadej nebo vyber předmět (např. Dějepis)!'); return; }
      if (!fullText) { alert('Vlož text sešitu!'); return; }

      const btn = document.getElementById('saveTextBtn');
      if (btn) {
        btn.innerText = '⏳ AI čte sešit a dělí ho podle nadpisů...';
        btn.disabled = true;
      }

      const systemPrompt = "Jsi asistent pro analýzu školních sešitů. Tvým úkolem je projít celý sešit, najít všechny hlavní nadpisy a rozdělit látku na logické úseky (témata) od nadpisu k nadpisu. Vrať VÝHRADNĚ validní JSON pole objektů s klíči 'title' (název nadpisu) a 'content' (veškerý text a poznámky patřící pod tento nadpis). Příklad: [{\"title\":\"1. Nadpis\",\"content\":\"text...\"}]";
      const userPrompt = `Zde je kompletní sešit předmětu ${subName}:\n\n${fullText}`;

      try {
        let raw = await callGemini(systemPrompt, userPrompt, true);
        const parsedTopics = extractTopicsListFromRawJson(raw);

        if (!parsedTopics || parsedTopics.length === 0) {
          throw new Error('AI nenašla v textu žádné nadpisy.');
        }

        await saveExtractedTopics(subName, parsedTopics);
      } catch (err) {
        alert('Chyba při zpracování: ' + (err.message || err));
        if (btn) {
          btn.innerText = '🚀 Nechat AI rozdělit sešit na témata';
          btn.disabled = false;
        }
      }
    }

    // --- HROMADNÉ FOTKY ---
    async function handleMultipleImages(input) {
      if (!input || !input.files || input.files.length === 0) return;
      const subName = getResolvedSubjectName();

      if (!subName) {
        alert('Nejprve nahoře zadej nebo vyber Předmět!');
        input.value = '';
        return;
      }

      const count = input.files.length;
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="text-center py-20">
          <div class="animate-spin text-4xl mb-4">🌀</div>
          <h2 class="text-xl font-bold mb-1">AI čte celý sešit (${count} fotek)...</h2>
          <p class="text-xs text-slate-400">Gemini přepisuje rukopis, hledá nadpisy a dělí sešit na kapitoly.</p>
        </div>
      `;

      try {
        const fileParts = [];
        for (let i = 0; i < input.files.length; i++) {
          const file = input.files[i];
          const b64 = await readFileAsBase64(file);
          fileParts.push({
            inline_data: { mime_type: file.type, data: b64 }
          });
        }

        const promptText = `Toto jsou stránky celého školního sešitu pro předmět ${subName}. 
Přečti veškeré poznámky, najdi hlavní nadpisy kapitol a rozděl látku na jednotlivá témata (úseky od nadpisu k nadpisu).
Vrať POUZE validní JSON pole objektů s klíči 'title' (výstižný název nadpisu) a 'content' (přepsaný text látky).`;

        const raw = await callGeminiApi({
          contents: [{ parts: [{ text: promptText }, ...fileParts] }],
          isJson: true
        });

        const parsedTopics = extractTopicsListFromRawJson(raw);
        await saveExtractedTopics(subName, parsedTopics);
      } catch (err) {
        alert('Chyba při čtení fotek: ' + (err.message || err));
        nav('vkladani');
      }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function saveExtractedTopics(subjectName, topicsList) {
      const cleanSubName = String(subjectName || 'Neznámý předmět').trim();

      let sub = state.subjects.find(s => s && s.name && s.name.toLowerCase() === cleanSubName.toLowerCase());
      if (!sub) {
        sub = { id: 'sub_' + Date.now(), name: cleanSubName, topics: [] };
        state.subjects.push(sub);
      }
      if (!Array.isArray(sub.topics)) sub.topics = [];

      topicsList.forEach(t => {
        if (t && (t.title || t.content)) {
          sub.topics.push({
            id: 'top_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            title: String(t.title || 'Kapitola').trim(),
            content: String(t.content || '').trim()
          });
        }
      });

      await pushToCloud();
      alert(`🎉 Hotovo! Sešit "${cleanSubName}" byl rozdělen na ${topicsList.length} kapitol.`);
      nav('home');
    }

    function renderFlashcardsView(cards) {
      let cur = 0;
      let flipped = false;

      function draw() {
        const c = cards[cur] || { q: 'Žádná otázka', a: 'Žádná odpověď' };
        document.getElementById('app').innerHTML = `
          <button onclick="nav('zkouseniHub')" class="text-xs text-slate-400 mb-3">← Zpět</button>
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">Kartička ${cur + 1} z ${cards.length}</h2>
          </div>
          <div id="cardBox" onclick="flip()" class="min-h-[220px] p-6 rounded-2xl bg-cardBg border border-purple-500/40 flex flex-col justify-center items-center text-center cursor-pointer active:scale-98 transition shadow-lg">
            <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">${flipped ? 'Odpověď' : 'Otázka (ťukni pro otočení)'}</span>
            <p class="text-lg font-semibold text-slate-100">${flipped ? (c.a || c.odpoved) : (c.q || c.otazka)}</p>
          </div>
          <div class="flex gap-3 mt-6">
            <button onclick="prev()" class="flex-1 py-3 bg-slate-800 rounded-xl font-bold text-sm">Předchozí</button>
            <button onclick="next()" class="flex-1 py-3 bg-purple-600 rounded-xl font-bold text-sm">Další</button>
          </div>
        `;
      }

      window.flip = () => { flipped = !flipped; draw(); };
      window.prev = () => { if(cur > 0) { cur--; flipped = false; draw(); } };
      window.next = () => { if(cur < cards.length - 1) { cur++; flipped = false; draw(); } else { alert('Prošel jsi všechny kartičky!'); nav('zkouseniHub'); } };
      draw();
    }
